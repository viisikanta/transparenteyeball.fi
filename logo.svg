<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!-- "TRANSPARENT" text -->
  <text x="300" y="72" text-anchor="middle" font-family="'Cormorant SC', 'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="52" fill="#f2ede4" letter-spacing="12">TRANSPARENT</text>

  <!-- "EYEBALL" text -->
  <text x="300" y="572" text-anchor="middle" font-family="'Cormorant SC', 'Cormorant Garamond', Georgia, serif" font-weight="500" font-size="62" fill="#f2ede4" letter-spacing="14">EYEBALL</text>

  <g transform="translate(300, 310)" stroke-linecap="round">
    <!-- Eye shape -->
    <path d="M-240,0 C-180,-130 -80,-185 0,-185 C80,-185 180,-130 240,0 C180,130 80,185 0,185 C-80,185 -180,130 -240,0 Z" stroke="#f2ede4" stroke-width="5" fill="none"/>

    <!-- Iris circle -->
    <circle cx="0" cy="0" r="78" stroke="#f2ede4" stroke-width="4" fill="none"/>

    <!-- Subtle radiating lines (woodcut feel) -->
    <g stroke="#f2ede4" stroke-width="0.8" opacity="0.5">
      <line x1="0" y1="-78" x2="0" y2="-100"/>
      <line x1="55" y1="-55" x2="70" y2="-70"/>
      <line x1="78" y1="0" x2="100" y2="0"/>
      <line x1="55" y1="55" x2="70" y2="70"/>
      <line x1="0" y1="78" x2="0" y2="100"/>
      <line x1="-55" y1="55" x2="-70" y2="70"/>
      <line x1="-78" y1="0" x2="-100" y2="0"/>
      <line x1="-55" y1="-55" x2="-70" y2="-70"/>
    </g>

    <!-- Pupil -->
    <circle cx="0" cy="0" r="34" fill="#f2ede4"/>
  </g>
</svg>